# laland — source of truth, organized like a doom-themes theme.
#
# [<variant>.colors]  doom's palette names. Each value is OKLCH, either
#   [L, C, H]                  exact chroma, or
#   { L = .., sat = .., H = .. } sat = fraction of the most saturated color sRGB holds at that L/H
#                              (1.0 = gamut edge, where channels hit 00/ff and look like highlighter ink)
# [<variant>.slots]   doom's semantic slots. A value is a color name or a doom helper:
#   "lighten:NAME:A"  "darken:NAME:A"  "blend:A:B:ALPHA"   (same sRGB math as doom-themes.el:301-343)
#
# Slot mapping follows doom-dracula (doom-dracula-theme.el:88-99), with pink in the magenta slot,
# and highlight (cursor, links, prompt, modeline bar) set to the UI pink.

[meta]
name = "laland"

# ── dark: "Midnight vivid", lightest bg (comfort round 6, choice 4); accents from trial "try-a": full saturation, Lc 56-75 ──────────────
[dark.colors]
bg        = [0.255, 0.040, 270]
bg-alt    = [0.225, 0.040, 270]
base0     = [0.195, 0.035, 270]
base1     = [0.235, 0.040, 270]
base2     = [0.275, 0.042, 270]
base3     = [0.300, 0.045, 270]
base4     = [0.654, 0.045, 270]
base5     = [0.776, 0.075, 270]
base6     = [0.816, 0.050, 270]
base7     = [0.857, 0.030, 270]
base8     = [0.937, 0.012, 270]
fg        = [0.957, 0.012, 270]
fg-alt    = [0.776, 0.075, 270]

# Pink, blue and violet sit a few degrees off their round-4 hues (350, 255, 300) -> 340, 238, 310: there sRGB holds
# more chroma at higher L, so they can be readable on the lighter bg at 100% saturation.
red       = { L = 0.740, sat = 1.00, H = 22 }   # kept darker than green so diffs and errors stay apart for color-blind readers
orange    = { L = 0.780, sat = 1.00, H = 55 }
green     = { L = 0.820, sat = 0.90, H = 150 }
teal      = { L = 0.821, sat = 0.90, H = 190 }
yellow    = { L = 0.800, sat = 0.55, H = 92 }   # strings: muted khaki so data recedes; warnings use a lightened copy
blue      = { L = 0.835, sat = 1.00, H = 238 }
dark-blue = { L = 0.45, sat = 0.60, H = 260 }
pink-ui   = { L = 0.80, sat = 1.00, H = 340 }   # UI accent pink, unchanged since approval
magenta   = { L = 0.780, sat = 1.00, H = 340 }   # the laland pink
violet    = { L = 0.760, sat = 1.00, H = 295 }   # types (JSON, TextEncoder...): saturated again, was a near-white lavender
cyan      = { L = 0.840, sat = 0.90, H = 200 }   # constants: pale aqua, kept apart from green functions for color-blind readers
dark-cyan = { L = 0.62, sat = 0.60, H = 210 }

[dark.slots]
grey         = "base4"
highlight    = "pink-ui"
vertical-bar = "darken:base1:0.1"
selection    = "dark-blue"
builtin      = "orange"
comments     = "base5"
doc-comments = "lighten:base5:0.25"
constants    = "cyan"
functions    = "green"
keywords     = "magenta"
methods      = "teal"
operators    = "violet"
type         = "violet"
strings      = "yellow"
variables    = "lighten:magenta:0.6"
numbers      = "violet"
region       = "blend:pink-ui:bg:0.22"
error        = "red"
warning      = "lighten:yellow:0.45"
success      = "green"
vc-modified  = "orange"
vc-added     = "green"
vc-deleted   = "red"
modeline-bg          = "darken:bg-alt:0.1"
modeline-bg-inactive = "bg-alt"
dim          = "blend:base4:bg:0.45"   # done headlines; Lc 13 like doom-dracula's base4 on its bg

# ── light: same hues on blue-tinted paper, accents darkened to read on white ──
[light.colors]
bg        = [0.975, 0.008, 270]
bg-alt    = [0.945, 0.012, 270]
base0     = [0.995, 0.004, 270]
base1     = [0.960, 0.010, 270]
base2     = [0.930, 0.014, 270]
base3     = [0.910, 0.016, 270]
base4     = [0.780, 0.020, 270]
base5     = [0.520, 0.050, 270]
base6     = [0.480, 0.040, 270]
base7     = [0.380, 0.030, 270]
base8     = [0.250, 0.020, 270]
fg        = [0.270, 0.025, 270]
fg-alt    = [0.520, 0.050, 270]

red       = { L = 0.41, sat = 0.90, H = 22 }
orange    = { L = 0.46, sat = 0.90, H = 45 }
green     = { L = 0.50, sat = 0.85, H = 155 }
teal      = { L = 0.55, sat = 0.85, H = 195 }
yellow    = { L = 0.54, sat = 0.95, H = 80 }
blue      = { L = 0.39, sat = 0.90, H = 255 }
dark-blue = { L = 0.85, sat = 0.40, H = 260 }
magenta   = { L = 0.56, sat = 0.85, H = 340 }
violet    = { L = 0.33, sat = 0.85, H = 300 }
cyan      = { L = 0.56, sat = 0.85, H = 215 }
dark-cyan = { L = 0.50, sat = 0.60, H = 220 }

[light.slots]
grey         = "base4"
highlight    = "magenta"
vertical-bar = "base2"
selection    = "dark-blue"
builtin      = "orange"
comments     = "base5"
doc-comments = "darken:base5:0.15"
constants    = "cyan"
functions    = "green"
keywords     = "magenta"
methods      = "teal"
operators    = "violet"
type         = "violet"
strings      = "yellow"
variables    = "darken:magenta:0.25"
numbers      = "violet"
region       = "blend:magenta:bg:0.16"
error        = "red"
warning      = "yellow"
success      = "green"
vc-modified  = "orange"
vc-added     = "green"
vc-deleted   = "red"
modeline-bg          = "darken:bg-alt:0.04"
modeline-bg-inactive = "bg-alt"
dim          = "blend:base4:bg:0.45"   # done headlines; Lc 13 like doom-dracula's base4 on its bg
